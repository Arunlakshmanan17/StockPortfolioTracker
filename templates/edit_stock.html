{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Stock | InvestTrack</title>

    <link
        rel="stylesheet"
        href="{% static 'css/style.css' %}"
    >

</head>


<body class="add-stock-page">


    <!-- ================= NAVBAR ================= -->

    <nav class="dashboard-navbar">

        <div class="dashboard-brand">

            📈

            <span>
                InvestTrack
            </span>

        </div>


        <div class="dashboard-nav-right">

            <a href="{% url 'dashboard' %}">
                Dashboard
            </a>

            <a
                href="{% url 'logout' %}"
                class="logout-button">

                Logout

            </a>

        </div>

    </nav>


    <!-- ================= MAIN ================= -->

    <main class="add-stock-container">


        <!-- HEADER -->

        <div class="add-stock-header">

            <span class="add-stock-icon">
                ✏️
            </span>

            <div>

                <h1>
                    Edit Stock
                </h1>

                <p>
                    Update your investment details
                </p>

            </div>

        </div>


        <!-- ================= FORM CARD ================= -->

        <div class="add-stock-card">


            <form
                method="POST"
                action="{% url 'edit_stock' stock.id %}"
            >

                {% csrf_token %}


                <!-- STOCK SYMBOL -->

                <div class="form-group">

                    <label for="symbol">
                        Stock Symbol
                    </label>

                    <input
                        type="text"
                        id="symbol"
                        name="symbol"
                        value="{{ stock.symbol }}"
                        maxlength="20"
                        required
                    >

                </div>


                <!-- COMPANY NAME -->

                <div class="form-group">

                    <label for="company_name">
                        Company Name
                    </label>

                    <input
                        type="text"
                        id="company_name"
                        name="company_name"
                        value="{{ stock.company_name }}"
                        required
                    >

                </div>


                <!-- QUANTITY -->

                <div class="form-group">

                    <label for="quantity">
                        Quantity
                    </label>

                    <input
                        type="number"
                        id="quantity"
                        name="quantity"
                        value="{{ stock.quantity }}"
                        min="1"
                        required
                    >

                </div>


                <!-- PURCHASE PRICE -->

                <div class="form-group">

                    <label for="purchase_price">
                        Purchase Price
                    </label>

                    <input
                        type="number"
                        id="purchase_price"
                        name="purchase_price"
                        value="{{ stock.purchase_price }}"
                        min="0.01"
                        step="0.01"
                        required
                    >

                </div>


                <!-- CURRENT PRICE -->

                <div class="form-group">

                    <label for="current_price">
                        Current Price
                    </label>

                    <input
                        type="number"
                        id="current_price"
                        name="current_price"
                        value="{{ stock.current_price }}"
                        min="0.01"
                        step="0.01"
                        required
                    >

                </div>


                <!-- BUTTONS -->

                <div class="form-actions">

                    <a
                        href="{% url 'dashboard' %}"
                        class="cancel-button">

                        Cancel

                    </a>


                    <button
                        type="submit"
                        class="add-stock-button">

                        Save Changes

                    </button>

                </div>

            </form>

        </div>

    </main>

</body>

</html>
